<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GUICHET+ Kiosk</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#13242b;background:#eef4f4}body{margin:0}.head{background:linear-gradient(135deg,#071a22,#075f62);color:#fff;padding:24px 34px;display:flex;align-items:center;gap:18px}.brand{width:64px;height:64px;border-radius:16px}.head h1{margin:0 0 6px}.head p{margin:0;color:#d4eeee}.card{background:#fff;margin:26px auto;padding:28px;border-radius:16px;max-width:570px;box-shadow:0 8px 30px #062a3020}label{display:block;font-weight:650;margin:18px 0 7px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b8c8ca;border-radius:8px;font-size:16px;background:#fff}.hint{color:#52666d;font-size:13px;margin:7px 0 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;background:#00a39a;color:#fff}.secondary{background:#e4efee;color:#075750}.status{margin-top:20px;padding:13px;border-radius:8px;background:#eef7f6}.ok{color:#087849}.bad{color:#b42318}.hidden{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.head{padding:20px}.card{margin:14px;padding:20px}}
  </style>
</head>
<body><header class="head"><img class="brand" src="guichetplus-icon.png" alt=""><div><h1>GUICHET+ Kiosk</h1><p>Digital Factory · Impression automatique sécurisée</p></div></header>
<main class="card"><h2>Imprimante</h2>
<label for="transport">Mode de connexion</label><select id="transport"><option value="network">Réseau · IP / port 9100</option><option value="windows">USB ou Bluetooth · imprimante Windows</option><option value="serial">Bluetooth · port série COM</option></select>
<section id="networkFields"><div class="grid"><div><label for="host">Adresse IP</label><input id="host"></div><div><label for="port">Port</label><input id="port" type="number" value="9100"></div></div></section>
<section id="windowsFields" class="hidden"><label for="printerName">Imprimante Windows</label><select id="printerName"></select><p class="hint">Compatible avec les imprimantes USB et Bluetooth installées dans Windows.</p></section>
<section id="serialFields" class="hidden"><div class="grid"><div><label for="serialPort">Port Bluetooth</label><select id="serialPort"></select></div><div><label for="serialBaud">Vitesse</label><select id="serialBaud"><option>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option></select></div></div></section>
<label for="profile">Compatibilité ESC/POS</label><select id="profile"><option value="auto">Universel · imprimantes chinoises</option><option value="native">ESC/POS moderne · Epson compatible</option><option value="legacy">Ancien modèle · ESC *</option></select><p class="hint">Le mode universel convertit le logo pour éviter que ses octets soient imprimés comme des caractères.</p>
<div class="row"><button id="save">Enregistrer</button><button class="secondary" id="refresh">Actualiser les périphériques</button><button class="secondary" id="test">Imprimer un test</button></div><div id="status" class="status">Vérification…</div></main>
<script>
const $=id=>document.querySelector('#'+id),transport=$('transport'),host=$('host'),port=$('port'),printerName=$('printerName'),serialPort=$('serialPort'),serialBaud=$('serialBaud'),profile=$('profile'),status=$('status'),networkFields=$('networkFields'),windowsFields=$('windowsFields'),serialFields=$('serialFields');
const message=(text,ok)=>{status.textContent=text;status.className='status '+(ok?'ok':'bad')};
function fields(){networkFields.classList.toggle('hidden',transport.value!=='network');windowsFields.classList.toggle('hidden',transport.value!=='windows');serialFields.classList.toggle('hidden',transport.value!=='serial')}
function options(select,items,value,label){select.innerHTML='';if(!items.length){select.add(new Option('Aucun périphérique détecté',''));return}items.forEach(item=>select.add(new Option(label(item),value(item))))}
async function devices(selectedPrinter='',selectedPort=''){try{const d=await fetch('http://127.0.0.1:3210/api/devices').then(r=>r.json());options(printerName,d.printers||[],x=>x.Name,x=>`${x.Name} · ${x.PortName||'port Windows'}`);options(serialPort,d.serialPorts||[],x=>x.DeviceID,x=>`${x.DeviceID} · ${x.Name||'Bluetooth série'}`);if(selectedPrinter)printerName.value=selectedPrinter;if(selectedPort)serialPort.value=selectedPort}catch(e){message('Détection Windows indisponible : '+e.message,false)}}
async function load(){const c=await fetch('http://127.0.0.1:3210/api/config').then(r=>r.json());transport.value=c.transport||'network';host.value=c.printerHost;port.value=c.printerPort;serialBaud.value=String(c.serialBaud||9600);profile.value=c.printerProfile||'auto';fields();await devices(c.printerName,c.serialPort);check()}
async function check(){try{const r=await fetch('http://127.0.0.1:3210/api/health'),j=await r.json();message(j.printer.online?'Imprimante en ligne':'Imprimante hors ligne : '+j.printer.error,j.printer.online)}catch(e){message(e.message,false)}}
transport.onchange=fields;
$('refresh').onclick=()=>devices(printerName.value,serialPort.value);
$('save').onclick=async()=>{const payload={transport:transport.value,printerHost:host.value,printerPort:Number(port.value),printerName:printerName.value,serialPort:serialPort.value,serialBaud:Number(serialBaud.value),printerProfile:profile.value};const r=await fetch('http://127.0.0.1:3210/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();message(r.ok?'Configuration enregistrée':j.error||'Configuration invalide',r.ok);if(r.ok)check()};
$('test').onclick=async()=>{message('Impression en cours…',true);try{const r=await fetch('http://127.0.0.1:3210/api/test',{method:'POST'}),j=await r.json();message(r.ok?'Ticket de test imprimé':j.error,r.ok)}catch(e){message(e.message,false)}};load();
</script></body></html>
