plugins { id 'com.android.application' }

android {
    namespace 'sn.digitalfactory.guichetplus.printagent'
    compileSdk 36

    defaultConfig {
        applicationId 'sn.digitalfactory.guichetplus.printagent'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
    }

    def keystorePath = System.getenv('GUICHETPLUS_KEYSTORE_PATH')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('GUICHETPLUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GUICHETPLUS_KEY_ALIAS') ?: 'guichetplus-upload'
                keyPassword System.getenv('GUICHETPLUS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }
}
