plugins { id 'com.android.application' }

android {
    namespace 'sn.digitalfactory.guichetplus.printagent'
    compileSdk 36

    defaultConfig {
        applicationId 'sn.digitalfactory.guichetplus.kiosk'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.1.7'
    }

    def guichetplusSetting = { String name ->
        def value = project.findProperty(name)
        if (value != null && value.toString().trim()) return value.toString()
        def env = System.getenv(name)
        return (env != null && env.trim()) ? env : null
    }
    def keystorePath = guichetplusSetting('GUICHETPLUS_KEYSTORE_PATH')
    def keystorePassword = guichetplusSetting('GUICHETPLUS_KEYSTORE_PASSWORD')
    def uploadKeyAlias = guichetplusSetting('GUICHETPLUS_KEY_ALIAS') ?: 'guichetplus-upload'
    def uploadKeyPassword = guichetplusSetting('GUICHETPLUS_KEY_PASSWORD')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }
}
